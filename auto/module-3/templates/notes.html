<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <title>Admin - Ghi chú</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <a target="_blank" rel="noopener noreferrer" href="/" class="flex items-center gap-2 text-indigo-600 font-bold text-xl hover:text-indigo-700 transition-colors">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <span>LocalAdmin</span>
                    </a>
                </div>
                <!-- Nav Links -->
                <nav class="flex items-center gap-6">
                    <a target="_blank" rel="noopener noreferrer" href="/" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Sản phẩm</a>
                    <a target="_blank" rel="noopener noreferrer" href="/collections" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Collections</a>
                    <a target="_blank" rel="noopener noreferrer" href="/create" class="text-sm font-bold text-red-600 hover:text-red-700 transition-colors">Tạo sản phẩm</a>
                    <a target="_blank" rel="noopener noreferrer" href="/edit-variants" class="text-sm font-bold text-red-600 hover:text-red-700 transition-colors">Sửa hàng loạt</a>
                    <a target="_blank" rel="noopener noreferrer" href="/notes" class="text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 pb-0.5">Ghi chú</a>
                    <a target="_blank" rel="noopener noreferrer" href="/reviews" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Reviews</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight flex items-center gap-2">
                <iconify-icon icon="mdi:note-edit-outline" class="text-indigo-600"></iconify-icon>
                Ghi chú nội bộ
            </h1>
            <p class="text-gray-500 mt-2">Lưu lại các ghi chú, nội dung text mẫu để sử dụng sau này. Tự động load nội dung đã lưu mỗi khi vào trang.</p>
        </div>

        <form id="notes-form" method="POST" action="/notes" class="space-y-6">
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07)] border border-gray-100">
                <textarea 
                    name="note_content" 
                    id="note_content" 
                    rows="15" 
                    tabindex="1"
                    autofocus
                    class="w-full p-4 bg-gray-50/70 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition-all resize-y"
                    placeholder="Nhập nội dung ghi chú ở đây..."
                >{{ note_content }}</textarea>
                
                <div class="mt-4 flex items-center justify-between">
                    <div id="status-message" class="text-sm font-medium opacity-0 transition-opacity"></div>
                    <button type="submit" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-8 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center gap-2 cursor-pointer focus:ring-4 focus:ring-indigo-200">
                        <iconify-icon icon="mdi:content-save-outline" class="text-xl"></iconify-icon>
                        <span>Lưu Ghi Chú</span>
                    </button>
                </div>
            </div>
        </form>
    </main>

    <script>
        // Focus textarea when pressing Tab outside of it
        document.addEventListener('keydown', function(e) {
            const textarea = document.getElementById('note_content');
            if (e.key === 'Tab' && document.activeElement !== textarea) {
                e.preventDefault();
                textarea.focus();
            }
        });

        // Allow using Tab key to insert tabs in textarea
        document.getElementById('note_content').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                var start = this.selectionStart;
                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "\t" + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
            }
        });

        document.getElementById('notes-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-message');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<iconify-icon icon="mdi:loading" class="text-xl animate-spin"></iconify-icon> <span>Đang lưu...</span>`;
            
            try {
                const formData = new FormData(this);
                const response = await fetch('/notes', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    statusMsg.textContent = result.message;
                    statusMsg.className = 'text-sm font-medium text-green-600 opacity-100 transition-opacity';
                } else {
                    statusMsg.textContent = result.message || 'Có lỗi xảy ra!';
                    statusMsg.className = 'text-sm font-medium text-red-600 opacity-100 transition-opacity';
                }
                
                // Hide message after 3 seconds
                setTimeout(() => {
                    statusMsg.classList.remove('opacity-100');
                    statusMsg.classList.add('opacity-0');
                }, 3000);
                
            } catch (error) {
                statusMsg.textContent = 'Lỗi kết nối!';
                statusMsg.className = 'text-sm font-medium text-red-600 opacity-100 transition-opacity';
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        });
    </script>
</body>
</html>
