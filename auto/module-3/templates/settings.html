<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <title>Admin - Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <a target="_blank" rel="noopener noreferrer" href="/" class="flex items-center gap-2 text-indigo-600 font-bold text-xl hover:text-indigo-700 transition-colors">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <span>Shopify Admin Manager</span>
                    </a>
                </div>
                <!-- Nav Links -->
                <nav class="flex items-center gap-6">
                    <a target="_blank" rel="noopener noreferrer" href="/" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Sản phẩm</a>
                    <a target="_blank" rel="noopener noreferrer" href="/collections" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Collections</a>
                    <a target="_blank" rel="noopener noreferrer" href="/create" class="text-sm font-bold text-red-600 hover:text-red-700 transition-colors">Tạo sản phẩm</a>
                    <a target="_blank" rel="noopener noreferrer" href="/edit-variants" class="text-sm font-bold text-red-600 hover:text-red-700 transition-colors">Sửa hàng loạt</a>
                    <a target="_blank" rel="noopener noreferrer" href="/notes" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Ghi chú</a>
                    <a target="_blank" rel="noopener noreferrer" href="/reviews" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Reviews</a>
                    <!-- Các nút nav button phải nằm bên trái nav button Settings -->
                    <a target="_blank" rel="noopener noreferrer" href="/blogs" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors flex items-center gap-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>Blog</a>
                    <a target="_blank" rel="noopener noreferrer" href="/settings" class="text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 pb-0.5 flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>Settings</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight flex items-center gap-2">
                <iconify-icon icon="mdi:cog-outline" class="text-indigo-600"></iconify-icon>
                Settings
            </h1>
            <p class="text-gray-500 mt-2">Cấu hình các cài đặt hệ thống của Shopify Admin Manager.</p>
        </div>

        <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07)] border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Bảo mật</h2>
            <form id="settings-form" class="space-y-4">
                <div>
                    <label for="current_password" class="block text-sm font-medium text-gray-700">Mật khẩu hiện tại</label>
                    <input type="password" id="current_password" name="current_password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" required placeholder="Nhập mật khẩu đang sử dụng">
                </div>
                
                <div class="mt-4">
                    <label for="new_password" class="block text-sm font-medium text-gray-700">Mật khẩu mới</label>
                    <p class="text-xs text-gray-500 mt-1 mb-2">Mật khẩu mới yêu cầu khi thực hiện chức năng xóa sản phẩm.</p>
                    <input type="password" id="new_password" name="new_password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" required placeholder="Nhập mật khẩu mới">
                </div>
                
                <div class="mt-6 flex items-center gap-4">
                    <button type="submit" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg shadow-sm transition-all focus:ring-4 focus:ring-indigo-200">
                        Cập nhật mật khẩu
                    </button>
                    <div id="status-message" class="text-sm font-medium transition-opacity"></div>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('settings-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-message');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Đang xử lý...';
            statusMsg.innerHTML = '';
            
            const formData = new FormData();
            formData.append('current_password', document.getElementById('current_password').value);
            formData.append('new_password', document.getElementById('new_password').value);
            
            try {
                const response = await fetch('/update-settings', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusMsg.innerHTML = '<span class="text-green-600">Cập nhật mật khẩu thành công!</span>';
                    document.getElementById('current_password').value = '';
                    document.getElementById('new_password').value = '';
                } else {
                    statusMsg.innerHTML = `<span class="text-red-600">Lỗi: ${data.message}</span>`;
                }
            } catch (err) {
                statusMsg.innerHTML = `<span class="text-red-600">Lỗi mạng: ${err.message}</span>`;
            }
            
            submitBtn.disabled = false;
            submitBtn.innerText = 'Cập nhật mật khẩu';
        });
    </script>
</body>
</html>
