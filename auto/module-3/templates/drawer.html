<!-- Drawer Menu & Backdrop (Ẩn hiện tức thì không hiệu ứng chuyển động) -->
{% set current_path = request.url.path if request and request.url else '' %}
<div id="drawer-backdrop" class="fixed inset-0 bg-black/40 z-[60] hidden" style="z-index: 60;" onclick="closeDrawer()"></div>
<div id="drawer-menu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-[70] hidden flex flex-col border-l border-gray-200" style="z-index: 70;">
    <!-- Header của Drawer -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 bg-gray-50">
        <div class="flex items-center gap-2 font-bold text-gray-800 text-base">
            <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
            </svg>
            <span>Menu Tiện ích</span>
        </div>
        <button type="button" onclick="closeDrawer()" class="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-200 rounded-lg focus:outline-none transition-colors" title="Đóng menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <!-- Danh sách liên kết -->
    <div class="p-4 space-y-2 flex-1 overflow-y-auto">
        <!-- Ghi chú -->
        <a target="_blank" rel="noopener noreferrer" href="/notes" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/notes' %}text-indigo-600 bg-indigo-50{% else %}text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/notes' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            <span>Ghi chú</span>
        </a>

        <!-- Quản lý Menu & Rút gọn link -->
        <a target="_blank" rel="noopener noreferrer" href="/menu-manager" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/menu-manager' %}text-indigo-600 bg-indigo-50{% else %}text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/menu-manager' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"></path>
            </svg>
            <div class="flex items-center justify-between flex-1">
                <span>Quản lý Menu</span>
                <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700">Mới</span>
            </div>
        </a>

        <!-- Reviews -->
        <a target="_blank" rel="noopener noreferrer" href="/reviews" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/reviews' %}text-indigo-600 bg-indigo-50{% else %}text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/reviews' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
            </svg>
            <span>Reviews</span>
        </a>

        <!-- Real Homes, Real Spaces -->
        <a target="_blank" rel="noopener noreferrer" href="/real-homes" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/real-homes' %}text-amber-700 bg-amber-50{% else %}text-gray-700 hover:bg-amber-50 hover:text-amber-700{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/real-homes' %}text-amber-700{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <div class="flex items-center justify-between flex-1">
                <span>Real Homes</span>
                <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">Showcase</span>
            </div>
        </a>

        <!-- Định danh của sản phẩm -->
        <a target="_blank" rel="noopener noreferrer" href="/product-identifiers" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/product-identifiers' %}text-indigo-600 bg-indigo-50{% else %}text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/product-identifiers' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
            </svg>
            <span>Định danh của sản phẩm</span>
        </a>

        <!-- Cập nhật logo ảnh sản phẩm -->
        <a target="_blank" rel="noopener noreferrer" href="/update-product-logo" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/update-product-logo' %}text-indigo-600 bg-indigo-50{% else %}text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/update-product-logo' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span>Cập nhật logo ảnh sản phẩm</span>
        </a>

        <!-- Danh sách khách hàng -->
        <a target="_blank" rel="noopener noreferrer" href="/customers" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/customers' %}text-indigo-600 bg-indigo-50{% else %}text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/customers' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span>Danh sách khách hàng</span>
        </a>

        <!-- Settings -->
        <a target="_blank" rel="noopener noreferrer" href="/settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/settings' %}text-indigo-600 bg-indigo-50{% else %}text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/settings' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Settings</span>
        </a>

        <!-- Kiểm tra VPS -->
        <a target="_blank" rel="noopener noreferrer" href="/vps-health" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold transition-colors {% if current_path == '/vps-health' %}text-emerald-600 bg-emerald-50{% else %}text-gray-700 hover:bg-emerald-50 hover:text-emerald-700{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/vps-health' %}text-emerald-600{% else %}text-emerald-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
            </svg>
            <span class="text-emerald-800">Kiểm tra VPS</span>
        </a>

        <!-- Đăng xuất -->
        <div class="pt-2 mt-2 border-t border-gray-100">
            <a href="/logout" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold text-rose-600 hover:bg-rose-50 hover:text-rose-700 transition-colors">
                <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                <span>Đăng xuất</span>
            </a>
        </div>
    </div>

    <!-- Footer nhỏ của Drawer -->
    <div class="px-5 py-3 border-t border-gray-100 bg-gray-50 text-xs text-gray-500 flex items-center justify-between">
        <span>Shopify Admin</span>
        <span class="text-indigo-600 font-semibold">Wrydeco</span>
    </div>
</div>

<script>
function openDrawer() {
    var bd = document.getElementById('drawer-backdrop');
    var dm = document.getElementById('drawer-menu');
    if (bd) bd.classList.remove('hidden');
    if (dm) dm.classList.remove('hidden');
}
function closeDrawer() {
    var bd = document.getElementById('drawer-backdrop');
    var dm = document.getElementById('drawer-menu');
    if (bd) bd.classList.add('hidden');
    if (dm) dm.classList.add('hidden');
}
function toggleDrawer() {
    var dm = document.getElementById('drawer-menu');
    if (dm && !dm.classList.contains('hidden')) {
        closeDrawer();
    } else {
        openDrawer();
    }
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeDrawer();
    }
});
</script>
