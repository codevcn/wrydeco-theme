<!-- Drawer Menu & Backdrop (Ẩn hiện tức thì không hiệu ứng chuyển động) -->
{% set current_path = request.url.path if request and request.url else '' %}
<div id="drawer-backdrop" class="fixed inset-0 bg-black/40 z-50 hidden" onclick="closeDrawer()"></div>
<div id="drawer-menu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-99 hidden flex flex-col border-l border-gray-200">
    <!-- Header của Drawer -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 bg-gray-50">
        <div class="flex items-center gap-2 font-bold text-gray-800 text-base">
            <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
            </svg>
            <span>Menu Tiện ích</span>
        </div>
        <button type="button" onclick="closeDrawer()" class="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-200 rounded-lg focus:outline-none transition-colors" title="Đóng menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <!-- Danh sách liên kết -->
    <div class="p-4 space-y-2 flex-1 overflow-y-auto">
        <!-- Ghi chú -->
        <a target="_blank" rel="noopener noreferrer" href="/notes" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors {% if current_path == '/notes' %}font-bold text-indigo-600 bg-indigo-50{% else %}font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/notes' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            <span>Ghi chú</span>
        </a>

        <!-- Reviews -->
        <a target="_blank" rel="noopener noreferrer" href="/reviews" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors {% if current_path == '/reviews' %}font-bold text-indigo-600 bg-indigo-50{% else %}font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/reviews' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
            </svg>
            <span>Reviews</span>
        </a>

        <!-- Settings -->
        <a target="_blank" rel="noopener noreferrer" href="/settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors {% if current_path == '/settings' %}font-bold text-indigo-600 bg-indigo-50{% else %}font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-600{% endif %}">
            <svg class="w-5 h-5 {% if current_path == '/settings' %}text-indigo-600{% else %}text-gray-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Settings</span>
        </a>
    </div>

    <!-- Footer nhỏ của Drawer -->
    <div class="px-5 py-3 border-t border-gray-100 bg-gray-50 text-xs text-gray-500 flex items-center justify-between">
        <span>Shopify Admin</span>
        <span class="text-indigo-600 font-semibold">Wrydeco</span>
    </div>
</div>

<script>
function openDrawer() {
    var bd = document.getElementById('drawer-backdrop');
    var dm = document.getElementById('drawer-menu');
    if (bd) bd.classList.remove('hidden');
    if (dm) dm.classList.remove('hidden');
}
function closeDrawer() {
    var bd = document.getElementById('drawer-backdrop');
    var dm = document.getElementById('drawer-menu');
    if (bd) bd.classList.add('hidden');
    if (dm) dm.classList.add('hidden');
}
function toggleDrawer() {
    var dm = document.getElementById('drawer-menu');
    if (dm && !dm.classList.contains('hidden')) {
        closeDrawer();
    } else {
        openDrawer();
    }
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeDrawer();
    }
});
</script>
