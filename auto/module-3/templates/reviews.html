<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews Playground - Shopify Local Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3">
                    <a target="_blank" rel="noopener noreferrer" href="/" class="flex items-center gap-2 text-indigo-600 font-bold text-xl hover:text-indigo-700 transition-colors">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <span>Shopify Admin Manager</span>
                    </a>
                </div>
                <!-- Nav Links -->
                <nav class="flex items-center gap-6">
                    <a target="_blank" rel="noopener noreferrer" href="/" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Sản phẩm</a>
                    <a target="_blank" rel="noopener noreferrer" href="/collections" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Collections</a>
                    <a target="_blank" rel="noopener noreferrer" href="/create" class="text-sm font-bold text-red-600 hover:text-red-700 transition-colors">Tạo sản phẩm</a>
                    <a target="_blank" rel="noopener noreferrer" href="/edit-variants" class="text-sm font-bold text-red-600 hover:text-red-700 transition-colors">Sửa hàng loạt</a>
                    <a target="_blank" rel="noopener noreferrer" href="/notes" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Ghi chú</a>
                    <a target="_blank" rel="noopener noreferrer" href="/reviews" class="text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 pb-0.5">Reviews</a>
                
                    <a target="_blank" rel="noopener noreferrer" href="/settings" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>Settings</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8 flex-1 w-full">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Reviews Playground</h1>
            <p class="text-gray-500 mt-2 text-sm">Upload file CSV để thao tác với hình ảnh đánh giá sản phẩm.</p>
        </div>
        
        <!-- Controls Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 items-end">
                <div class="w-full">
                    <label for="csvFileInput" class="block text-sm font-medium text-gray-700 mb-1">Upload Các File CSV</label>
                    <input type="file" id="csvFileInput" accept=".csv" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition-colors border border-gray-300 rounded-md p-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                
                <div class="w-full">
                    <label for="photoUrlCol" class="block text-sm font-medium text-gray-700 mb-1">Photo URL Column Name</label>
                    <input type="text" id="photoUrlCol" value="photo_url" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-md py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm" placeholder="e.g. photo_url">
                </div>

                <div class="w-full">
                    <label for="productIdCol" class="block text-sm font-medium text-gray-700 mb-1">Product ID Column Name</label>
                    <input type="text" id="productIdCol" value="product_Id" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-md py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                </div>

                <div class="w-full">
                    <label for="productHandleCol" class="block text-sm font-medium text-gray-700 mb-1">Product Handle Column Name</label>
                    <input type="text" id="productHandleCol" value="product_handle" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-md py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button id="processBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-8 rounded-md transition-colors shadow-sm">
                    Process CSV
                </button>
            </div>
        </div>

        <!-- Image Gallery Section -->
        <div id="gallerySection" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-800">Gallery Preview</h2>
                <span id="rowCount" class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full">0 images</span>
            </div>
            
            <div id="galleryContainer" class="flex flex-col gap-6">
                <!-- File sections will be injected here -->
            </div>
        </div>
    </main>

    <!-- PapaParse for easy CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const csvFileInput = document.getElementById('csvFileInput');
            const photoUrlColInput = document.getElementById('photoUrlCol');
            const productIdColInput = document.getElementById('productIdCol');
            const productHandleColInput = document.getElementById('productHandleCol');
            const processBtn = document.getElementById('processBtn');
            const gallerySection = document.getElementById('gallerySection');
            const galleryContainer = document.getElementById('galleryContainer');
            const rowCountEl = document.getElementById('rowCount');

            processBtn.addEventListener('click', () => {
                const files = csvFileInput.files;
                if (!files || files.length === 0) {
                    alert('Vui lòng chọn ít nhất 1 file CSV!');
                    return;
                }

                const colName = photoUrlColInput.value.trim();
                const pidColName = productIdColInput.value.trim();
                const phColName = productHandleColInput.value.trim();
                
                if (!colName) {
                    alert('Vui lòng nhập tên cột chứa URL ảnh!');
                    return;
                }

                galleryContainer.innerHTML = '';
                gallerySection.classList.remove('hidden');
                rowCountEl.textContent = 'Đang xử lý...';
                
                let totalValidImages = 0;

                Array.from(files).forEach((file, index) => {
                    const placeholder = document.createElement('div');
                    galleryContainer.appendChild(placeholder);

                    Papa.parse(file, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            const data = results.data;
                            let validImages = 0;
                            const parsedImages = [];
                            let currentRowId = 0;

                            data.forEach((row, rowIndex) => {
                                const rawUrl = row[colName];
                                const pid = row[pidColName] || '';
                                const phandle = row[phColName] || '';

                                if (rawUrl && typeof rawUrl === 'string' && rawUrl.trim() !== '') {
                                    const cleanedRawUrl = rawUrl.replace(/^["']|["']$/g, '').trim();
                                    const urls = cleanedRawUrl.split(',').map(u => u.trim()).filter(u => u !== '');
                                    
                                    if (urls.length > 0) {
                                        currentRowId++;
                                        urls.forEach(url => {
                                            validImages++;
                                            totalValidImages++;
                                            parsedImages.push({ url, pid, phandle, rowId: currentRowId, rowIndex: rowIndex });
                                        });
                                    }
                                }
                            });

                            const isFirst = index === 0;

                            const fileSection = document.createElement('div');
                            fileSection.className = 'bg-white rounded-xl shadow-sm border border-gray-200 p-0 overflow-hidden';
                            
                            const fileHeader = document.createElement('div');
                            fileHeader.className = 'flex items-center justify-between p-4 bg-gray-50 hover:bg-gray-100 cursor-pointer transition-colors border-b border-gray-100';
                            fileHeader.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <svg class="w-5 h-5 text-gray-500 transform transition-transform duration-200 chevron-icon ${isFirst ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    <h3 class="text-lg font-semibold text-gray-800 break-all">${file.name}</h3>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-medium text-gray-500 bg-white px-3 py-1 rounded-full border border-gray-200 file-count">${validImages} images</span>
                                    <button class="export-btn flex items-center justify-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full border border-indigo-200 transition-colors text-sm font-semibold" title="Export CSV">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        Export
                                    </button>
                                </div>
                            `;
                            fileSection.appendChild(fileHeader);
                            
                            const fileGalleryWrapper = document.createElement('div');
                            fileGalleryWrapper.className = `p-6 ${isFirst ? '' : 'hidden'}`;
                            
                            const fileGallery = document.createElement('div');
                            fileGallery.className = 'flex flex-wrap';
                            fileGallery.style.gap = '10px';
                            fileGalleryWrapper.appendChild(fileGallery);
                            fileSection.appendChild(fileGalleryWrapper);

                            const renderImages = () => {
                                if (fileGallery.children.length > 0) return;
                                const fragment = document.createDocumentFragment();
                                parsedImages.forEach(imgData => {
                                    const imgContainer = document.createElement('div');
                                    imgContainer.className = 'relative w-32 h-32 flex-shrink-0 border border-gray-200 rounded-md overflow-hidden shadow-sm bg-gray-50 cursor-pointer';
                                    
                                    const img = document.createElement('img');
                                    img.src = imgData.url;
                                    img.className = 'w-full h-full object-cover hover:scale-110 transition-transform duration-200 ease-out will-change-transform';
                                    img.loading = 'lazy';
                                    img.alt = 'Review Photo';
                                    img.onerror = function() {
                                        this.onerror = null;
                                        this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="%23cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>';
                                    };
                                    
                                    const badge = document.createElement('span');
                                    badge.className = 'absolute top-1 left-1 bg-black/70 text-white text-[0.9rem] font-bold px-1.5 py-0.5 rounded shadow z-10 pointer-events-none';
                                    badge.textContent = imgData.rowId;

                                    imgContainer.onclick = function() {
                                        window.currentCsvData = data;
                                        window.currentColName = colName;
                                        window.currentFileGallery = fileGallery;
                                        openPreviewModal(parsedImages, parsedImages.indexOf(imgData));
                                    };
                                    
                                    imgContainer.appendChild(img);
                                    imgContainer.appendChild(badge);
                                    fragment.appendChild(imgContainer);
                                });
                                fileGallery.appendChild(fragment);
                            };

                            const unmountImages = () => {
                                fileGallery.innerHTML = '';
                            };

                            let isExpanded = isFirst;
                            if (isExpanded) renderImages();

                            fileHeader.addEventListener('click', () => {
                                isExpanded = !isExpanded;
                                const chevron = fileHeader.querySelector('.chevron-icon');
                                if (isExpanded) {
                                    chevron.classList.add('rotate-180');
                                    fileGalleryWrapper.classList.remove('hidden');
                                    renderImages();
                                } else {
                                    chevron.classList.remove('rotate-180');
                                    fileGalleryWrapper.classList.add('hidden');
                                    unmountImages();
                                }
                            });

                            const exportBtn = fileHeader.querySelector('.export-btn');
                            exportBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                
                                const csvStr = Papa.unparse(data);
                                const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
                                const url = URL.createObjectURL(blob);
                                const link = document.createElement('a');
                                link.href = url;
                                link.setAttribute('download', 'exported_' + file.name);
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                            });

                            galleryContainer.replaceChild(fileSection, placeholder);
                            
                            rowCountEl.textContent = `Total: ${totalValidImages} images`;
                        },
                        error: function(err) {
                            alert(`Lỗi khi đọc file ${file.name}: ${err.message}`);
                        }
                    });
                });
            });
        });

        // Image Preview Modal Logic
        document.addEventListener('DOMContentLoaded', () => {
            const previewModal = document.getElementById('previewModal');
            const previewImage = document.getElementById('previewImage');
            const previewProductId = document.getElementById('previewProductId');
            const previewProductHandle = document.getElementById('previewProductHandle');
            const previewRowId = document.getElementById('previewRowId');
            
            window.currentPreviewImages = [];
            window.currentPreviewIndex = 0;

            window.openPreviewModal = function(images, index) {
                window.currentPreviewImages = images;
                window.currentPreviewIndex = index;
                const imgData = images[index];
                showPreviewModal(imgData.url, imgData.pid, imgData.phandle, imgData.rowId);
            };

            window.navigatePreview = function(direction, event) {
                if (event) event.stopPropagation();
                if (!window.currentPreviewImages || window.currentPreviewImages.length === 0) return;
                
                let newIndex = window.currentPreviewIndex + direction;
                if (newIndex < 0) newIndex = window.currentPreviewImages.length - 1;
                if (newIndex >= window.currentPreviewImages.length) newIndex = 0;
                
                window.openPreviewModal(window.currentPreviewImages, newIndex);
            };

            window.showPreviewModal = function(url, pid, phandle, rowId) {
                // Tạm ẩn và xóa src ảnh cũ
                previewImage.src = '';
                previewImage.classList.add('hidden');
                
                if (pid) {
                    previewProductId.textContent = `Product ID: ${pid}`;
                    previewProductId.classList.remove('hidden');
                } else {
                    previewProductId.classList.add('hidden');
                }
                
                if (phandle) {
                    previewProductHandle.textContent = `Product Handle: ${phandle}`;
                    previewProductHandle.classList.remove('hidden');
                } else {
                    previewProductHandle.classList.add('hidden');
                }

                if (rowId !== undefined) {
                    previewRowId.textContent = `Row ID: ${rowId}`;
                    previewRowId.classList.remove('hidden');
                } else {
                    previewRowId.classList.add('hidden');
                }

                // Hiện khung popup nền đen trước
                previewModal.classList.remove('hidden');
                previewModal.classList.add('flex');

                // Delay 2 frames rồi mới gán src ảnh để tránh lag lúc mở popup
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        previewImage.src = url;
                        previewImage.classList.remove('hidden');
                    });
                });
            };
            
            window.closePreviewModal = function() {
                previewModal.classList.add('hidden');
                previewModal.classList.remove('flex');
                previewImage.src = '';
                if(typeof window.closeReviewCommentPopover === 'function') window.closeReviewCommentPopover();
            };
            
            previewModal.addEventListener('click', function(e) {
                if (e.target === previewModal) {
                    closePreviewModal();
                }
            });
            window.deletePreviewImage = function() {
                document.getElementById('confirmDeleteModal').classList.remove('hidden');
                document.getElementById('confirmDeleteModal').classList.add('flex');
            };
            
            window.closeConfirmDelete = function() {
                document.getElementById('confirmDeleteModal').classList.add('hidden');
                document.getElementById('confirmDeleteModal').classList.remove('flex');
            };
            
            window.executeDeleteImage = function() {
                window.closeConfirmDelete();
                
                const imgData = window.currentPreviewImages[window.currentPreviewIndex];
                const rowIndex = imgData.rowIndex;
                
                // Xóa URL trong file CSV
                const row = window.currentCsvData[rowIndex];
                let cellStr = row[window.currentColName];
                let cleanedStr = cellStr.replace(/^["']|["']$/g, '').trim();
                let urls = cleanedStr.split(',').map(u => u.trim());
                let urlIndex = urls.indexOf(imgData.url);
                if (urlIndex !== -1) {
                    urls.splice(urlIndex, 1);
                    row[window.currentColName] = urls.join(', ');
                }
                
                // Xóa trên giao diện
                window.currentFileGallery.removeChild(window.currentFileGallery.children[window.currentPreviewIndex]);
                window.currentPreviewImages.splice(window.currentPreviewIndex, 1);
                
                if (window.currentPreviewImages.length > 0) {
                    let nextIndex = window.currentPreviewIndex;
                    if (nextIndex >= window.currentPreviewImages.length) {
                        nextIndex = window.currentPreviewImages.length - 1;
                    }
                    window.openPreviewModal(window.currentPreviewImages, nextIndex);
                } else {
                    window.closePreviewModal();
                }
            };

            window.openReviewCommentPopover = function(btn) {
                const popover = document.getElementById('reviewCommentPopover');
                const imgData = window.currentPreviewImages[window.currentPreviewIndex];
                const rowIndex = imgData.rowIndex;
                const row = window.currentCsvData[rowIndex];
                
                // Read from body (or any other appropriate column)
                document.getElementById('reviewCommentInput').value = row['body'] || '';
                
                popover.classList.remove('hidden');
                
                const btnRect = btn.getBoundingClientRect();
                const popoverRect = popover.getBoundingClientRect();
                
                let top = btnRect.top - popoverRect.height - 8;
                let left = btnRect.left - popoverRect.width + btnRect.width;
                
                if (top < 12) top = btnRect.bottom + 8;
                if (top + popoverRect.height > window.innerHeight - 12) top = window.innerHeight - popoverRect.height - 12;
                if (left < 12) left = 12;
                if (left + popoverRect.width > window.innerWidth - 12) left = window.innerWidth - popoverRect.width - 12;
                
                popover.style.top = `${top}px`;
                popover.style.left = `${left}px`;
            };
            
            window.closeReviewCommentPopover = function() {
                document.getElementById('reviewCommentPopover').classList.add('hidden');
            };
            
            window.saveReviewComment = function() {
                const imgData = window.currentPreviewImages[window.currentPreviewIndex];
                const rowIndex = imgData.rowIndex;
                const newComment = document.getElementById('reviewCommentInput').value;
                
                window.currentCsvData[rowIndex]['body'] = newComment;
                window.closeReviewCommentPopover();
            };

            window.editPreviewImage = function() {
                const imgData = window.currentPreviewImages[window.currentPreviewIndex];
                document.getElementById('editUrlInput').value = imgData.url;
                document.getElementById('editUrlModal').classList.remove('hidden');
                document.getElementById('editUrlModal').classList.add('flex');
            };
            
            window.closeEditUrl = function() {
                document.getElementById('editUrlModal').classList.add('hidden');
                document.getElementById('editUrlModal').classList.remove('flex');
            };
            
            window.executeEditUrl = function() {
                const newUrl = document.getElementById('editUrlInput').value.trim();
                if (!newUrl) {
                    alert('Vui lòng nhập URL hợp lệ!');
                    return;
                }
                
                const imgData = window.currentPreviewImages[window.currentPreviewIndex];
                const rowIndex = imgData.rowIndex;
                
                // Thay URL trong file CSV
                const row = window.currentCsvData[rowIndex];
                let cellStr = row[window.currentColName];
                let cleanedStr = cellStr.replace(/^["']|["']$/g, '').trim();
                let urls = cleanedStr.split(',').map(u => u.trim());
                let urlIndex = urls.indexOf(imgData.url);
                if (urlIndex !== -1) {
                    urls[urlIndex] = newUrl;
                    row[window.currentColName] = urls.join(', ');
                }
                
                imgData.url = newUrl;
                
                const imgEl = window.currentFileGallery.children[window.currentPreviewIndex].querySelector('img');
                if (imgEl) imgEl.src = newUrl;
                
                window.openPreviewModal(window.currentPreviewImages, window.currentPreviewIndex);
                window.closeEditUrl();
            };

            const confirmDeleteModal = document.getElementById('confirmDeleteModal');
            confirmDeleteModal.addEventListener('click', function(e) {
                if (e.target === confirmDeleteModal) {
                    closeConfirmDelete();
                }
            });

            const editUrlModal = document.getElementById('editUrlModal');
            editUrlModal.addEventListener('click', function(e) {
                if (e.target === editUrlModal) {
                    closeEditUrl();
                }
            });

        });
    </script>
    
    <!-- Image Preview Modal -->
    <div id="previewModal" class="hidden fixed inset-0 z-[100] bg-black/90 items-center justify-center p-[12px]">
        <!-- Info boxes -->
        <div class="absolute top-4 left-4 z-10 flex flex-col gap-2">
            <div id="previewProductId" class="bg-white text-black px-3 py-1.5 rounded-md shadow-md text-sm font-semibold hidden max-w-[200px] truncate transition-all duration-300 ease-in-out hover:max-w-2xl cursor-default" title="Hover to expand"></div>
            <div id="previewProductHandle" class="bg-white text-black px-3 py-1.5 rounded-md shadow-md text-sm font-semibold hidden max-w-[200px] truncate transition-all duration-300 ease-in-out hover:max-w-2xl cursor-default" title="Hover to expand"></div>
            <div id="previewRowId" class="bg-white text-black px-3 py-1.5 rounded-md shadow-md text-[0.9rem] font-bold hidden w-max cursor-default"></div>
        </div>
        
        <button onclick="closePreviewModal()" class="absolute top-4 right-4 z-10 text-white hover:text-gray-300 bg-white/10 hover:bg-white/20 rounded-full p-2 backdrop-blur-md transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div class="absolute bottom-6 right-6 z-10 flex flex-col gap-4 pointer-events-auto">
            <button onclick="openReviewCommentPopover(this)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-md shadow-md font-medium transition-colors text-sm w-full">Sửa Comment</button>
            <button onclick="editPreviewImage()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md shadow-md font-medium transition-colors text-sm w-full">Sửa URL ảnh</button>
            <button onclick="deletePreviewImage()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-md shadow-md font-medium transition-colors text-sm w-full">Xóa ảnh</button>
        </div>
        
        <div class="flex items-center justify-center w-full h-full gap-2 relative pointer-events-none">
            <button onclick="navigatePreview(-1, event)" class="text-white hover:text-gray-300 bg-white/10 hover:bg-white/20 rounded-full p-4 backdrop-blur-md transition-all flex-shrink-0 z-10 pointer-events-auto" title="Previous">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <img id="previewImage" src="" class="max-w-[calc(100%-120px)] object-contain rounded-lg shadow-2xl pointer-events-auto" style="width: auto; height: 100%;" alt="Preview">
            <button onclick="navigatePreview(1, event)" class="text-white hover:text-gray-300 bg-white/10 hover:bg-white/20 rounded-full p-4 backdrop-blur-md transition-all flex-shrink-0 z-10 pointer-events-auto" title="Next">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </div>

    <!-- Review Comment Popover -->
    <div id="reviewCommentPopover" class="fixed z-[150] hidden bg-white rounded-lg shadow-xl p-4 w-[350px] border border-gray-200">
        <div class="flex justify-between items-center mb-2">
            <h4 class="font-bold text-gray-800">Sửa Comment</h4>
            <button onclick="closeReviewCommentPopover()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <textarea id="reviewCommentInput" class="w-full h-32 border border-gray-300 rounded-md p-2 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        <button onclick="saveReviewComment()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-md text-sm font-bold transition-colors">Lưu thay đổi</button>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmDeleteModal" class="hidden fixed inset-0 z-[200] bg-black/60 items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6 relative">
            <button onclick="closeConfirmDelete()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-lg font-bold text-gray-900 mb-2">Xác nhận xóa</h3>
            <p class="text-gray-600 mb-6">Bạn có chắc chắn muốn xóa ảnh này không?</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeConfirmDelete()" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md font-medium transition-colors">Hủy</button>
                <button onclick="executeDeleteImage()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md font-medium transition-colors">OK</button>
            </div>
        </div>
    </div>

    <!-- Edit URL Modal -->
    <div id="editUrlModal" class="hidden fixed inset-0 z-[200] bg-black/60 items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 relative">
            <button onclick="closeEditUrl()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-lg font-bold text-gray-900 mb-4">Sửa URL ảnh</h3>
            <input type="text" id="editUrlInput" class="w-full border border-gray-300 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500 mb-6" placeholder="Nhập URL mới">
            <div class="flex justify-end gap-3">
                <button onclick="closeEditUrl()" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md font-medium transition-colors">Hủy</button>
                <button onclick="executeEditUrl()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-medium transition-colors">OK</button>
            </div>
        </div>
    </div>
</body>
</html>
