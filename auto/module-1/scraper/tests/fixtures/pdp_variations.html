<!doctype html><html><body>
<div id="corePrice_feature_div"><span class="a-price"><span class="a-offscreen">$100.00</span></span></div>
<div id="inline-twister-row-color_name">
  <div class="dimension-text"><span class="a-color-secondary">Color:</span></div>
  <ul>
    <li data-asin="B000000001"><span class="a-button-selected"><input role="radio" type="submit" onclick="pick(event, this, '$100.00')"></span><img class="swatch-image" alt="Natural"></li>
    <li data-asin="B000000002"><span><input role="radio" type="submit" onclick="pick(event, this, '$125.00')"></span><img class="swatch-image" alt="Walnut"></li>
  </ul>
</div>
<script>
function pick(event, input, price) {
  event.preventDefault();
  document.querySelectorAll('#inline-twister-row-color_name li span').forEach(node => node.classList.remove('a-button-selected'));
  input.parentElement.classList.add('a-button-selected');
  document.querySelector('#corePrice_feature_div .a-offscreen').textContent = price;
}
</script>
</body></html>
