<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-labelledby="c1-title c1-desc">
  <title id="c1-title">Concept 1: Biophilic Monolith</title>
  <desc id="c1-desc">Architectural brutalist-organic monogram of W with catenary archways and cantilevered timber lintel</desc>
  <g fill="currentColor">
    <!-- Floating Upper Lintel (Live-edge architectural beam) -->
    <rect x="18" y="16" width="64" height="4.5" rx="2.25"/>
    
    <!-- Primary Monolithic W Structure -->
    <path d="
      M 16,25
      H 29
      L 39.5,67
      L 46.5,33
      H 53.5
      L 60.5,67
      L 71,25
      H 84
      L 68,82
      H 55.5
      L 50,56
      L 44.5,82
      H 32
      Z
    "/>
    
    <!-- Parabolic Arch Cutout & Base Structural Footings -->
    <path d="M 43,82 Q 50,66 57,82 Z" fill="#F5F1ED" opacity="0.15"/>
    <circle cx="50" cy="27" r="2.5"/>
  </g>
</svg>
