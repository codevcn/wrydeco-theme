<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-labelledby="c5-title c5-desc">
  <title id="c5-title">Concept 5: Canopy Synthesis</title>
  <desc id="c5-desc">Biophilic node network connecting automated catalog ingestion with branching botanical tree canopy forming letter W</desc>
  <!-- Curved Biological Network Edges -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Outer Trunk Arm -->
    <path d="M 50 82 C 38 82, 32 70, 32 58 C 32 44, 22 38, 18 26" stroke-width="2.6"/>
    <!-- Left Inner Branch -->
    <path d="M 32 58 C 32 48, 38 42, 42 36 C 46 30, 48 26, 50 22" stroke-width="2.2"/>
    <!-- Right Inner Branch -->
    <path d="M 68 58 C 68 48, 62 42, 58 36 C 54 30, 52 26, 50 22" stroke-width="2.2"/>
    <!-- Right Outer Trunk Arm -->
    <path d="M 50 82 C 62 82, 68 70, 68 58 C 68 44, 78 38, 82 26" stroke-width="2.6"/>
    
    <!-- Secondary Interconnecting Data Hyphae -->
    <path d="M 18 26 C 26 34, 34 36, 42 36" stroke-width="1.4" opacity="0.45" stroke-dasharray="2 3"/>
    <path d="M 82 26 C 74 34, 66 36, 58 36" stroke-width="1.4" opacity="0.45" stroke-dasharray="2 3"/>
    <path d="M 32 58 Q 50 64 68 58" stroke-width="1.6" opacity="0.5"/>
  </g>
  
  <!-- Synthesis Nodes (Pipeline Stages & Botanical Buds) -->
  <g fill="currentColor">
    <!-- Zenith Canopy Apex -->
    <circle cx="50" cy="22" r="4.2"/>
    <circle cx="50" cy="22" r="7.0" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.4"/>
    
    <!-- Left & Right Primary Terminal Nodes -->
    <circle cx="18" cy="26" r="3.6"/>
    <circle cx="82" cy="26" r="3.6"/>
    
    <!-- Inner Sub-Canopy Nodes -->
    <circle cx="42" cy="36" r="3.0"/>
    <circle cx="58" cy="36" r="3.0"/>
    
    <!-- Mid-Trunk Branching Hubs -->
    <circle cx="32" cy="58" r="3.2"/>
    <circle cx="68" cy="58" r="3.2"/>
    
    <!-- Root Core Hub (Orchestrator Origin) -->
    <circle cx="50" cy="82" r="4.5"/>
    
    <!-- Ambient Cellular Pulses -->
    <circle cx="28" cy="42" r="1.6" opacity="0.6"/>
    <circle cx="72" cy="42" r="1.6" opacity="0.6"/>
    <circle cx="50" cy="52" r="1.8" opacity="0.5"/>
  </g>
</svg>
