<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-labelledby="c4-title c4-desc">
  <title id="c4-title">Concept 4: Mortise &amp; Tenon</title>
  <desc id="c4-desc">Japanese wood joinery interlocking timber planes with traditional Nakashima butterfly spline</desc>
  <g id="mortise-tenon-w">
    <!-- Top Chamfered Facets (Light Surface) -->
    <path d="M 16 26 L 28 19 L 36 24 L 24 31 Z" fill="currentColor" opacity="0.4"/>
    <path d="M 76 31 L 64 24 L 72 19 L 84 26 Z" fill="currentColor" opacity="0.4"/>
    <path d="M 44 38 L 50 34 L 56 38 L 50 42 Z" fill="currentColor" opacity="0.45"/>
    
    <!-- Primary Timber Columns (Mid Surface / Body) -->
    <!-- Left Outer Leg -->
    <path d="M 24 31 L 36 24 L 46 72 L 34 78 Z" fill="currentColor"/>
    <!-- Left Inner Riser -->
    <path d="M 34 78 L 44 73 L 50 42 L 44 38 Z" fill="currentColor" opacity="0.85"/>
    <!-- Right Inner Riser -->
    <path d="M 50 42 L 56 38 L 66 73 L 56 78 Z" fill="currentColor" opacity="0.85"/>
    <!-- Right Outer Leg -->
    <path d="M 76 31 L 64 24 L 54 72 L 66 78 Z" fill="currentColor"/>
    
    <!-- Transverse Interlocking Through-Tenon Beam -->
    <rect x="18" y="48" width="64" height="6" rx="1.5" fill="currentColor" opacity="0.9"/>
    <!-- Mortise Exposed Pegs / End Wedges -->
    <rect x="14" y="49" width="4" height="4" rx="0.8" fill="currentColor" opacity="0.4"/>
    <rect x="82" y="49" width="4" height="4" rx="0.8" fill="currentColor" opacity="0.4"/>
    
    <!-- Traditional Handcrafted Butterfly Joint (Chigiri / Nakashima Spline) -->
    <path d="M 46 51 L 54 48 L 51 51 L 54 54 L 46 51 Z" fill="#F5F1ED"/>
    
    <!-- Plinth Anchoring Feet -->
    <rect x="26" y="80" width="16" height="4" rx="1" fill="currentColor" opacity="0.6"/>
    <rect x="58" y="80" width="16" height="4" rx="1" fill="currentColor" opacity="0.6"/>
  </g>
</svg>
