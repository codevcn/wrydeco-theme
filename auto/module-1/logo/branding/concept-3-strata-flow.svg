<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-labelledby="c3-title c3-desc">
  <title id="c3-title">Concept 3: Strata Flow</title>
  <desc id="c3-desc">Topographic contour line system evoking live-edge wood grain and river currents forming letter W</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Contour 1: Upper Canopy Strata -->
    <path d="M 18 22 C 24 48, 30 68, 36.5 68 C 42 68, 46 36, 50 36 C 54 36, 58 68, 63.5 68 C 70 68, 76 48, 82 22" stroke-width="2.6" opacity="0.45"/>
    
    <!-- Contour 2: Primary Live-Edge Flow -->
    <path d="M 16 33 C 23 60, 30 76, 36.5 76 C 42 76, 46 46, 50 46 C 54 46, 58 76, 63.5 76 C 70 76, 77 60, 84 33" stroke-width="3.6"/>
    
    <!-- Contour 3: Heartwood Timber Grain -->
    <path d="M 17 45 C 24 68, 31 83, 36.5 83 C 42 83, 46 56, 50 56 C 54 56, 58 83, 63.5 83 C 69 83, 76 68, 83 45" stroke-width="3.2"/>
    
    <!-- Contour 4: Base Root Line -->
    <path d="M 21 57 C 27 75, 32 89, 36.5 89 C 41.5 89, 45.5 66, 50 66 C 54.5 66, 58.5 89, 63.5 89 C 68 89, 73 75, 79 57" stroke-width="2.8" opacity="0.75"/>
  </g>
  <!-- Concentric Live-Edge Growth Knot Accent -->
  <g fill="currentColor">
    <circle cx="50" cy="22" r="2.5"/>
    <circle cx="50" cy="22" r="5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
  </g>
</svg>
